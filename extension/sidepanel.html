<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>CodeCartographer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #555;
    --border: #ccc;
    --rail: #ddd;
    --surface: #f4f4f4;
    --accent: #1a1a1a;
    --accent-hover: #333;
    --accent-fg: #ffffff;
    --disabled: #999;
    --focus: #2f6feb;
    --error: #b00020;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1f22;
      --fg: #e8e8e8;
      --muted: #a0a0a0;
      --border: #44464b;
      --rail: #3a3c40;
      --surface: #2a2c30;
      --accent: #e8e8e8;
      --accent-hover: #ffffff;
      --accent-fg: #1a1a1a;
      --disabled: #5a5c60;
      --focus: #6ea0ff;
      --error: #ff6b81;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 1rem;
    color: var(--fg);
    background: var(--bg);
  }
  h1 { font-size: 1.05rem; margin: 0 0 0.75rem; }
  form { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
  input[type="text"] {
    padding: 0.5rem 0.6rem;
    font-size: 0.9rem;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: var(--focus);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 25%, transparent);
  }
  button {
    padding: 0.5rem 1rem;
    font-size: 0.9rem;
    font-weight: 500;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-fg);
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: var(--accent-hover); }
  button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  button:disabled { background: var(--disabled); cursor: default; }
  #answer { white-space: pre-wrap; line-height: 1.5; font-size: 0.9rem; }
  .citations { margin-top: 1rem; padding-left: 0; list-style: none; }
  .citations li {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 0.8rem;
    background: var(--surface);
    border-radius: 4px;
    padding: 0.3rem 0.5rem;
    margin-bottom: 0.3rem;
    word-break: break-all;
  }
  #progress {
    margin: 0 0 1rem 0;
    padding-left: 0;
    list-style: none;
    font-size: 0.8rem;
    color: var(--muted);
  }
  #progress li {
    padding: 0.2rem 0;
    border-left: 2px solid var(--rail);
    padding-left: 0.6rem;
    margin-bottom: 0.15rem;
  }
  #progress li.active {
    border-left-color: var(--accent);
    color: var(--fg);
    font-weight: 500;
  }
  #error { color: var(--error); font-size: 0.85rem; }
  #error:empty { display: none; }
  #options-link { font-size: 0.8rem; color: var(--muted); }
  #options-link a { color: var(--muted); }
  #options-link a:hover { color: var(--fg); }
</style>
</head>
<body>
  <h1>Ask your codebase</h1>
  <form id="ask-form">
    <input type="text" id="repo-path" placeholder="/path/to/indexed/repo" required />
    <input type="text" id="question" placeholder="What does X do?" required />
    <button type="submit" id="submit-btn">Ask</button>
  </form>
  <div id="error"></div>
  <ul id="progress"></ul>
  <div id="answer"></div>
  <ul class="citations" id="citations"></ul>
  <p id="options-link"><a href="options.html" target="_blank">Backend settings</a></p>

  <script src="sidepanel.js"></script>
</body>
</html>
